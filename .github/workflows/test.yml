name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pagoda
          POSTGRES_PASSWORD: pagoda
          POSTGRES_DB: pagoda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pagoda -d pagoda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Test
      run: make test
