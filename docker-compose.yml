services:
  postgres:
    image: postgres:17-alpine
    container_name: memleak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: memleak
      POSTGRES_PASSWORD: memleak
      POSTGRES_DB: memleak
    ports:
      - "5432:5432"
    volumes:
      - memleak-postgres:/var/lib/postgresql/data
      # Creates the database used by `make test` alongside the main one.
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memleak -d memleak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memleak-postgres:
