services:
  postgres:
    image: postgres:17-alpine
    container_name: pagoda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pagoda
      POSTGRES_PASSWORD: pagoda
      POSTGRES_DB: pagoda
    ports:
      - "5432:5432"
    volumes:
      - pagoda-postgres:/var/lib/postgresql/data
      # Creates the database used by `make test` alongside the main one.
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagoda -d pagoda"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pagoda-postgres:
