http:
  hostname: ""
  port: 8000
  readTimeout: "5s"
  writeTimeout: "10s"
  idleTimeout: "2m"
  shutdownTimeout: "10s"
  tls:
    enabled: false
    certificate: ""
    key: ""

app:
  name: "Pagoda"
  # We manually set this rather than using the HTTP settings in order to build absolute URLs for users
  # since it's likely your app's HTTP settings are not identical to what is exposed by your server.
  host: "http://localhost:8000"
  environment: "local"
  # Change this on any live environments.
  encryptionKey: "?E(G+KbPeShVmYq3t6w9z$C&F)J@McQf"
  timeout: "20s"
  passwordToken:
      expiration: "60m"
      length: 64
  emailVerificationTokenExpiration: "12h"

cache:
  capacity: 100000
  expiration:
    publicFile: "4380h"

database:
  # Application data lives in PostgreSQL. Migrations are embedded in the binary and applied on startup.
  connection: "postgres://pagoda:pagoda@localhost:5432/pagoda?sslmode=disable"
  # Used when the environment is "test".
  # $RAND will be automatically replaced with a random value, giving each test process its own
  # throwaway schema so that packages tested in parallel cannot clobber each other. The schema is
  # created on startup and dropped on shutdown.
  testConnection: "postgres://pagoda:pagoda@localhost:5432/pagoda_test?sslmode=disable&search_path=test_$RAND"
  # The task queue (backlite) is SQLite-only, so it keeps its own database.
  # $RAND will be automatically replaced with a random value.
  # memdb is more robust for an in-memory database rather than :memory: because the latter has the potential
  # retain data even after you close and re-open the connection.
  tasksConnection: "dbs/tasks.db?_journal=WAL&_timeout=5000&_fk=true"

files:
  directory: "uploads"

tasks:
  goroutines: 1
  releaseAfter: "15m"
  cleanupInterval: "1h"
  shutdownTimeout: "10s"

mail:
  hostname: "localhost"
  port: 25
  user: "admin"
  password: "admin"
  fromAddress: "admin@localhost"
